name: Collect Kalshi demo alerts and simulated strategy

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: kalshi-alerts-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify implementation
        run: python3 scripts/verify_alerts_site.py
      - name: Collect public Kalshi demo data
        env:
          KALSHI_API_ROOT: https://external-api.demo.kalshi.co/trade-api/v2
        run: python3 -m automation.pipeline
      - name: Commit alert and portfolio observations
        run: |
          git config user.name "alerts-collector-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME" --autostash
          git add data/alerts
          if git diff --cached --quiet; then
            echo "No alert data changes to commit"
          else
            git commit -m "alerts: demo observations $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Request GitHub Pages rebuild for main-branch data update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${GITHUB_REPOSITORY}/pages/builds
