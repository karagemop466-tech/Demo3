name: Checks

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Swing alert detector tests (offline; session 6d201d19)
        run: python3 scripts/tests/test_price_alerts.py

      - name: Offline refresh test (mock server, no network)
        run: python3 scripts/tests/test_refresh_offline.py

      - name: Site and data checks (sources, JSON, internal links)
        run: python3 scripts/check_site.py

      - name: Swing scanner + backtest tests (same rule as the browser engine)
        run: |
          python3 scripts/tests/test_scan_swings.py
          python3 scripts/scan_swings.py --offline --out /tmp/swings_check
          git status --porcelain | grep -q "data/swings\|alerts/model.json" && {
            echo "::error::offline scan must not touch the published files"; exit 1; } || true

      - name: Alert-core + console tests (shared rule, fee model, ROI gate, jsdom smoke)
        run: |
          node --check assets/swing-core.js
          node --check assets/alert-console.js
          npm ci --no-audit --no-fund
          node --test tests/swing_core.test.js tests/alert_console.test.js

      - name: Canonical root site checks (links, per-row sources, syntax)
        run: python3 scripts/verify_root_site.py

      - name: High-ROI model artefact (deterministic rebuild + consistency tests)
        run: |
          # data/ is refreshed by the scheduled collector on its own cadence, so the test is
          # that the generator is deterministic and its numbers recompute from the data on
          # this commit - not that the committed artefact equals a rebuild.
          python3 model/build_roi_model.py
          cp data/latest/roi_model.json /tmp/roi1.json
          python3 model/build_roi_model.py
          cmp /tmp/roi1.json data/latest/roi_model.json
          echo "roi model rebuild is deterministic"
          python3 scripts/tests/test_roi_model.py
          python3 scripts/build_report_pages.py
          git checkout -- data/latest/roi_model.json model.html requirements.html
          echo "artefacts restored"

      - name: Strategy backtest (deterministic rebuild + consistency tests)
        run: |
          # The published artefacts are pinned to a data snapshot; the scheduled collector
          # refreshes data/ independently, so a rebuild may legitimately differ from the
          # commit. (GitHub validates PRs against the merge commit with main, where data/ is
          # newer than any branch.) What must hold: two rebuilds are byte-identical, and every
          # published metric is recomputed from the published trades.
          python3 scripts/backtest_strategies.py
          python3 scripts/build_strategy_page.py
          cp strategy/data/backtest.json /tmp/run1.json
          cp strategy.html /tmp/run1.html
          python3 scripts/backtest_strategies.py
          python3 scripts/build_strategy_page.py
          cmp /tmp/run1.json strategy/data/backtest.json
          cmp /tmp/run1.html strategy.html
          echo "rebuild is deterministic"
          python3 -m unittest discover -s scripts/tests -p "test_backtest*.py" -v
          git checkout -- strategy/data/backtest.json strategy.html
          echo "published artefacts restored"
