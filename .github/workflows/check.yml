name: Checks

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Offline refresh test (mock server, no network)
        run: python3 scripts/tests/test_refresh_offline.py

      - name: Site and data checks (sources, JSON, internal links)
        run: python3 scripts/check_site.py

      - name: Swing scanner + backtest tests (same rule as the browser engine)
        run: |
          python3 scripts/tests/test_scan_swings.py
          python3 scripts/scan_swings.py --offline --out /tmp/swings_check
          git status --porcelain | grep -q "data/swings\|alerts/model.json" && {
            echo "::error::offline scan must not touch the published files"; exit 1; } || true

      - name: Alert-core + console tests (shared rule, fee model, ROI gate, jsdom smoke)
        run: |
          node --check assets/swing-core.js
          node --check assets/alerts.js
          npm ci --no-audit --no-fund
          node --test tests/swing_core.test.js tests/alert_console.test.js

      - name: Canonical root site checks (links, per-row sources, syntax)
        run: python3 scripts/verify_root_site.py
