name: Checks

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Offline refresh test (mock server, no network)
        run: python3 scripts/tests/test_refresh_offline.py

      - name: Site and data checks (sources, JSON, internal links)
        run: python3 scripts/check_site.py

      - name: JavaScript syntax
        run: node --check assets/app.js

      - name: Canonical root site checks (links, per-row sources, syntax)
        run: python3 scripts/verify_root_site.py

      - name: Live swing-alert logic tests (pure functions)
        run: node --test tests/alerts.test.js

      - name: Live swing-alert page DOM test (jsdom, mocked API)
        run: npm ci --no-audit --no-fund && node --test tests/alerts.dom.test.js
