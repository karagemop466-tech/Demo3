name: Demo trade / portfolio

# Manual execution against the Kalshi DEMO account.
# Requires repository secrets (ONE pair is enough - both workflows that need the demo key,
# this one and kalshi-portfolio.yml, accept either pair since session 3528551d, F-3528-03):
#   KALSHI_DEMO_API_KEY_ID  or  KALSHI_KEY_ID        - demo API key id (Account & security -> API Keys)
#   KALSHI_DEMO_PRIVATE_KEY or  KALSHI_PRIVATE_KEY   - demo private key as PEM text
#
# Security (session 3528551d, F-3528-02): workflow inputs are passed to the shell through
# environment variables and an argument array. They are never interpolated into the script
# text and nothing is eval-ed, because this job holds the signing key
# (https://docs.github.com/en/actions/concepts/security/script-injections).
# Demo credentials are NOT shared with production
# (https://docs.kalshi.com/getting_started/demo_env.md).
# If the secrets are absent this workflow exits successfully with a clear FLAGGED
# message and writes nothing (no guessing, no inferred values).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "portfolio | trade | settle"
        required: true
        default: portfolio
        type: choice
        options: [portfolio, trade, settle]
      ticker:
        description: "Market ticker (trade mode), e.g. KXBTCD-26DEC31-T100000"
        required: false
      action:
        description: "buy | sell (trade mode)"
        required: false
        type: choice
        options: [buy, sell]
      side:
        description: "yes | no (trade mode)"
        required: false
        type: choice
        # quoted: bare yes/no are booleans to YAML 1.1 parsers
        options: ['yes', 'no']
      count:
        description: "Contracts (trade mode)"
        required: false
        default: "1"
      price:
        description: "Dollars per contract (trade mode), e.g. 0.55"
        required: false
      strategy_tag:
        description: "Strategy tag recorded with the trade"
        required: false
        default: directional
      dry_run:
        description: "Record the trade locally without sending it"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install signing dependency
        run: pip install cryptography

      - name: Offline trading tests
        run: python3 trading/test_trading.py -v

      - name: Guard - secrets present?
        id: guard
        env:
          KEY_ID: ${{ secrets.KALSHI_DEMO_API_KEY_ID || secrets.KALSHI_KEY_ID }}
          PEM: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY || secrets.KALSHI_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$PEM" ]; then
            echo "FLAGGED: demo-account credentials are not configured as repository secrets."
            echo "Portfolio tracking and order execution are implemented but cannot run until"
            echo "KALSHI_DEMO_API_KEY_ID / KALSHI_DEMO_PRIVATE_KEY (or KALSHI_KEY_ID / KALSHI_PRIVATE_KEY)"
            echo "are added (demo environment only)."
            echo "See https://demo.kalshi.co and https://docs.kalshi.com/getting_started/demo_env.md"
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute (portfolio / trade / settle)
        if: steps.guard.outputs.has_secrets == 'true'
        env:
          KALSHI_DEMO_API_KEY_ID: ${{ secrets.KALSHI_DEMO_API_KEY_ID || secrets.KALSHI_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY || secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_API_ROOT: https://external-api.demo.kalshi.co/trade-api/v2
          IN_MODE: ${{ inputs.mode }}
          IN_TICKER: ${{ inputs.ticker }}
          IN_ACTION: ${{ inputs.action }}
          IN_SIDE: ${{ inputs.side }}
          IN_COUNT: ${{ inputs.count }}
          IN_PRICE: ${{ inputs.price }}
          IN_STRATEGY_TAG: ${{ inputs.strategy_tag }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 2; }
          args=(portfolio)
          case "$IN_MODE" in
            trade)
              # Validate every free-text input before it reaches the trading script.
              [[ "$IN_TICKER" =~ ^[A-Za-z0-9._-]{1,120}$ ]] || fail "ticker must be 1-120 characters of A-Z a-z 0-9 . _ -"
              [[ "$IN_ACTION" == "buy" || "$IN_ACTION" == "sell" ]] || fail "action must be buy or sell"
              [[ "$IN_SIDE" == "yes" || "$IN_SIDE" == "no" ]] || fail "side must be yes or no"
              [[ "$IN_COUNT" =~ ^[1-9][0-9]{0,5}$ ]] || fail "count must be a positive whole number"
              [[ "$IN_PRICE" =~ ^(0(\.[0-9]{1,4})?|1(\.0{1,4})?)$ ]] || fail "price must be dollars between 0 and 1, e.g. 0.55"
              [[ "$IN_STRATEGY_TAG" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || fail "strategy_tag must be 1-40 characters of A-Z a-z 0-9 . _ -"
              args=(trade --ticker "$IN_TICKER" --action "$IN_ACTION" --side "$IN_SIDE"
                    --count "$IN_COUNT" --price "$IN_PRICE" --strategy-tag "$IN_STRATEGY_TAG")
              if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
              ;;
            settle) args=(settle) ;;
            portfolio|"") args=(portfolio) ;;
            *) fail "mode must be portfolio, trade or settle" ;;
          esac
          python3 trading/kalshi_trade.py "${args[@]}"

      - name: Record flag without secrets (writes nothing)
        if: steps.guard.outputs.has_secrets == 'false'
        run: |
          echo "Unverified: demo credentials not present; no order or portfolio data written." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit snapshots
        env:
          IN_MODE: ${{ inputs.mode }}
        run: |
          case "$IN_MODE" in portfolio|trade|settle) ;; *) IN_MODE=portfolio ;; esac
          git config user.name "trading-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME" --quiet
          git merge --ff-only "origin/$GITHUB_REF_NAME" 2>/dev/null || true
          git add data/portfolio.json data/trades.json
          if git diff --cached --quiet; then
            echo "No trade/portfolio changes to commit"
          else
            git commit -m "trading: $IN_MODE run $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
