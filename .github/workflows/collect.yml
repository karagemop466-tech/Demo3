name: Collect Kalshi demo snapshots

# Snapshots the Kalshi DEMO exchange (official recommended root
# https://external-api.demo.kalshi.co/trade-api/v2, per
# https://docs.kalshi.com/getting_started/api_environments.md) into data/.
# GitHub Actions runners have unrestricted egress; this repo's dev sandbox does not,
# which is why collection lives here rather than in a local shell.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (runs on the default branch after merge)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: collect-kalshi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Offline pipeline tests (mock API)
        run: python3 collector/test_collect.py -v

      - name: Collect live demo snapshots
        env:
          KALSHI_API_ROOT: https://external-api.demo.kalshi.co/trade-api/v2
        run: python3 collector/collect.py

      # Snapshot commits happen on the default branch only. Committing on every push (as an
      # earlier version did) rewrites data/ on feature branches while other sessions work,
      # which forces rebases mid-task and puts open pull requests into a conflicted state.
      - name: Commit snapshots (default branch only)
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "collector-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME" --autostash || \
            echo "::warning::rebase failed; pushing snapshot on top of latest origin state"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "collector: snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Request Pages rebuild (data pushes use GITHUB_TOKEN, which does not
              trigger the legacy pages-build-deployment workflow)
        # Single `if:` — a duplicated `if:` key here made GitHub reject the whole
        # workflow file (every Collect run failed; I-F91-01). Same condition as
        # the "Commit snapshots" step above (default branch == main on this repo).
        if: github.ref_name == github.event.repository.default_branch
        run: |
          # Pushes made with GITHUB_TOKEN do not trigger workflow runs (GitHub
          # recursion guard), so the legacy "deploy from branch" Pages build would
          # not fire for data-only commits. Request it explicitly via the API
          # (https://docs.github.com/en/rest/pages/pages#request-a-page-build).
          code=$(curl -s -o /tmp/pages_build.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")
          echo "pages build request HTTP $code"
          cat /tmp/pages_build.json | head -5
