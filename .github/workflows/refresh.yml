name: Refresh Kalshi data

on:
  schedule:
    - cron: "17 * * * *"   # hourly, at minute 17 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-kalshi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run refresh job (official Kalshi public API only)
        run: python3 scripts/refresh_kalshi.py

      - name: Check data and site
        run: |
          python3 scripts/check_site.py

      - name: Commit data if changed
        run: |
          git config user.name "kalshi-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh Kalshi snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
