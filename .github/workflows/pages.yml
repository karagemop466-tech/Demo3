# Publishes the repository root as the GitHub Pages site through a custom Actions workflow.
#
# Why: legacy "deploy from branch" Pages builds are limited to a soft 10 builds per hour
# (https://docs.github.com/en/pages/getting-started-with-github-pages/github-pages-limits).
# Repository pushes from many sessions and the 10-minute collector exceeded that limit on
# 2026-11-20 and legacy builds errored ("Page build failed.") from 19:39Z. Sites published
# through a custom Actions workflow are not subject to that limit. Run 44811117945 (commit
# 22d5160, 2026-11-20T20:24:42Z) completed "Enable Pages" and "Deploy to GitHub Pages" successfully.
#
# Triggers: every push to main, and workflow_dispatch. collect.yml dispatches this workflow
# after each snapshot, because data-only commits made with GITHUB_TOKEN do not trigger push workflows.

name: Deploy GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deployment.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Report current Pages source (informational)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" -q '"build_type=" + .build_type' || echo "build_type unavailable"

      - name: Stage site
        run: |
          rm -rf _site && mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
          test -f _site/index.html
          test -f _site/.nojekyll
          echo "staged files: $(find _site -type f | wc -l)"
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
